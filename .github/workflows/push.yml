name: Build Lean project

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  style_lint:
    name: Lint style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Don't 'import Mathlib', use precise imports
        if: always()
        run: |
          ! (find ClassFieldTheory -name "*.lean" -type f -print0 | xargs -0 grep -E -n '^import Mathlib$')

      - name: Files in ClassFieldTheory.Mathlib can't import ClassFieldTheory files outside ClassFieldTheory.Mathlib
        run: |
          ! (find ClassFieldTheory/Mathlib -name "*.lean" -type f -print0 | xargs -0 grep -E -n '^import ClassFieldTheory.(?!Mathlib)')

  build:
    name: Build project
    # Pinned: on the ubuntu-26.04 image (`ubuntu-latest` since November 2026) the API docs build
    # runs out of memory whenever it has to regenerate mathlib's docs from scratch, which happens
    # after every mathlib bump. The same build succeeds on ubuntu-24.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build and lint the project
        id: build-lean
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0

      - name: Upstreaming dashboard
        if: github.ref == 'refs/heads/main'
        uses: leanprover-community/upstreaming-dashboard-action@main
        with:
          website-directory: ./website
          project-name: ClassFieldTheory
          relevant-labels: CFT
          include-drafts: true
          branch-name: main

      - if: github.ref == 'refs/heads/main'
        name: File dependencies
        run: |
          sudo apt-get update
          sudo apt install graphviz -y
          ~/.elan/bin/lake exe graph website/file_deps.pdf

      - if: github.ref == 'refs/heads/main'
        name: Build project documentation
        id: build-docgen
        uses: leanprover-community/docgen-action@main
        with:
          blueprint: true
          # The action can also upload and deploy the site, but its deploy step looks for the
          # artifact right after the upload and often does not find it yet
          # (actions/deploy-pages#451, leanprover-community/docgen-action#43). That fails this job
          # after the docs have been built, so the docs cache is not saved either. The next step
          # and the `deploy` job upload and deploy instead.
          deploy: false

      # The upload step that the action would otherwise run. The action leaves the blueprint and
      # the API docs in `docs/`. Pushes only, like the action: a manual run does not build the
      # API docs, so deploying it would remove them from the site.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Upload website (API documentation and blueprint)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/

  # A separate job, so that the artifact is looked up well after it was uploaded, and so that a
  # failed deployment does not fail the `build` job. "Re-run failed jobs" then re-runs only this
  # job, which deploys the artifact that `build` uploaded (it is kept for one day). A re-run
  # deploys the commit of its own run, so only re-run the latest run on `main`.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # No `url`: the deploy step's `page_url` is the root of the site, and there is no page there.
    environment: github-pages
    steps:
      # A deployment can fail for a reason that is gone a minute later (an earlier deployment
      # still in progress, the artifact not listed yet), so a failed one is tried once more.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait before the second attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (second attempt)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
